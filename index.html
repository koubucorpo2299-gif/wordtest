<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>単語テスト作成システム</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>単語テスト作成システム</h1>
  </header>

  <main class="app-main">
    <section class="wordbook-panel">
      <div class="panel-header">
        <h2>単語帳一覧</h2>
        <button id="btn-add-wordbook" class="btn-secondary">＋ 単語帳を追加</button>
      </div>
      <ul id="wordbook-list" class="wordbook-list"></ul>
    </section>

    <section id="test-preview" class="test-preview hidden"></section>
  </main>
</div>

<!-- 単語帳 追加・編集 モーダル -->
<div id="wordbook-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2 id="wordbook-modal-title">単語帳を追加</h2>
      <button class="modal-close" data-close="wordbook-modal">&times;</button>
    </div>
    <p class="modal-sub">単語帳の名前と単語データを入力してください</p>

    <div class="form-group">
      <label>単語帳の名前</label>
      <input type="text" id="wordbook-name" placeholder="例）ターゲット1900">
    </div>

    <div class="form-group">
      <label>単語データ（1行に1単語。「番号,単語,意味」の形式）</label>
      <textarea id="wordbook-entries" rows="10" placeholder="1,apple,りんご&#10;2,book,本&#10;3,cat,猫"></textarea>
      <p class="field-hint">カンマ区切り、またはタブ区切りで入力できます。</p>
    </div>

    <button id="btn-save-wordbook" class="btn-primary">保存する</button>
  </div>
</div>

<!-- 小テスト作成 モーダル -->
<div id="test-modal" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-header">
      <h2>小テスト作成</h2>
      <button class="modal-close" data-close="test-modal">&times;</button>
    </div>
    <p class="modal-sub">問題範囲と問題数を指定してください</p>

    <div class="form-row two-col">
      <div class="form-group">
        <label>開始番号</label>
        <input type="number" id="range-start" min="1">
      </div>
      <div class="form-group">
        <label>終了番号</label>
        <input type="number" id="range-end" min="1">
      </div>
    </div>

    <div class="form-group">
      <label>問題数</label>
      <input type="number" id="question-count" min="1">
    </div>

    <div class="form-group">
      <label>出題方向</label>
      <select id="direction">
        <option value="word-meaning">英語→日本語</option>
        <option value="meaning-word">日本語→英語</option>
      </select>
    </div>

    <div class="form-group">
      <label>並び順</label>
      <select id="order">
        <option value="shuffle">シャッフル</option>
        <option value="sequential">番号順</option>
      </select>
    </div>

    <button id="btn-generate" class="btn-primary">作成する</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
